<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos e quebra de linha</title>
</head>
<body>
    <h1>Parágrafos e quebra de linhas</h1>
    <hr>
    <p>Na tag &lt;p&gt; e &lt;/p&gt; você pode escrever 

        de qualquer forma
        um paragrafo.
    </p>
    <p>Se você precisar quebrar uma linha, precisara usar um &lt;br&gt;. Com isso a linha <br> vai quebrar</p>
</body>
</html>
