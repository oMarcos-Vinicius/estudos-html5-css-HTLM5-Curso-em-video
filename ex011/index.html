<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 730px)" srcset="img/Paisagem-pequeno.jpg" type="image/jpg">
        <source media="(max-width: 1230px)" srcset="img/Paisagem-medio.jpg" type="image/jpg">
        <img src="img/Paisagem-grande.jpg" alt="Imagem de um paisagem">
    </picture>
    
</body>
</html>
