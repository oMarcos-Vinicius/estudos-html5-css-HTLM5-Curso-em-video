<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudos Elementos</title>
    <style>
        a {
            text-decoration: none;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
        }
        a:visited {
            color: gray;
        }

        a:hover {
            background-color: rgb(41, 40, 40);
            text-decoration: underline;
            color: white;
        }

        a:active {
            color: white;
            background-color: rgb(130, 130, 0);
        }

        a::after {
            content: ' [Link]';
            font-size: 0.7em;
            color: gray;
        }

        .especial::before {
            content: " -->>";
        }

        .especial::after {
            content: " <<-- [Link]";
        }


    </style>
</head>
<body>
    <h2>Links úteis</h2>
    <ul>
        <li>
            <a href="https://gustavoguanabara.github.io/" target="_blank">Repositorio do Curso em Video</a>
        </li>
        <li>
            <a href="https://www.youtube.com/@cursoemvideo" target="_blank" class="especial">Youtube do Curso em Video</a>
        </li>
        <li>
            <a href="https://www.cursoemvideo.com/" target="_blank">Site do Curso em Video</a>
        </li>
    </ul>
</body>
</html>
