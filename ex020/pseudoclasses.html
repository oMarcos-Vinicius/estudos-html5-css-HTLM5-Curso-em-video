<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classes em CSS</title>
    <style>
        div {
            background-color: #c6c6c6;
            text-align: center;
            height: 250px;
            width: 250px;
            display: inline-block;
        }

        div:hover {
            background-color: yellow;
        }
        
    </style>
</head>
<body>
    <div>1</div>
    <div>2</div>
    <div>3</div>
</body>
</html>
