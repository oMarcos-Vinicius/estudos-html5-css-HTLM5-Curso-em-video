<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * {
            height: 100%;
        }
        body {
            background-image: linear-gradient(45deg, blue 50%, rgb(107, 107, 239), rgb(212, 212, 237));
        }
        p {
            background-image: linear-gradient(to left, blue, white);
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente em CSS</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. A repellat ipsa assumenda consequuntur, numquam voluptates dolore quasi perferendis, consequatur fuga tenetur odio? Minus maiores non possimus esse autem dolorem incidunt?</p>
</body>
</html>%
