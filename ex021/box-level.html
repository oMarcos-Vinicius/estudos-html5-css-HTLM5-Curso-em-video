<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-level</title>
    <style>
        h1 {
            height: 300px;
            width: 300px;
            background-color: #D1D3D1;
            border: 10px solid #2B4F4B;
            padding: 10px 10px 10px 10px;
            margin: 20px 20px 40px 20px;
            outline: 10px dotted orange;

        }

        a {
            padding: 10px;
            border: 10px groove red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixas box-level</h1>
    <p>
        Paragráfos também são exemplos de box-level, mas os "<a href="#">links são exemplos de caixas inline-level</a>". Vamos ver como tudo isso funciona."
    </p>
</body>
</html>
