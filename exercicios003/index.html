<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com imagens</title>
</head>
<body>
    <h1>Carregando e exibindo imagens</h1>
    <hr>
    <p>Vamos carregar a imagem do HTML5:</p>
    <img src="img/html5-logo.png" alt="Logo do HTML5">
    <p>Agora vamos carregar a imagem do CSS3</p>
    <img src="css-logo.png" alt="Logo do CSS3">
    <p>Por fim, vamos carregar uma imagem do JavaScript direto na Rede</p>
    <img src="https://www.w3schools.com/js/img_javascript_480.jpg" alt="Logo do JavaScript">
</body>
</html>
